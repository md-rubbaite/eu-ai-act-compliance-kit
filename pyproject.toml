[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aiact"
version = "1.0.0"
description = "EU AI Act compliance kit: classify AI systems, list obligations with their application dates (Digital Omnibus included) and gate releases on missing evidence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rubbaite T. Hassain" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "ruff>=0.17.5"]

[project.scripts]
aiact = "aiact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/aiact/rules.py" = ["E501"]
