name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  compliance-gate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install .
      - name: The complete example passes as of today
        run: aiact assess examples/support-chatbot.toml >> "$GITHUB_STEP_SUMMARY"
      - name: The high-risk example, assessed as of the release date looking 400 days ahead (gaps expected; report only)
        run: aiact assess examples/cv-screening.toml --as-of 2026-11-22 --horizon 400 >> "$GITHUB_STEP_SUMMARY" || test $? -eq 1
      - name: The prohibited example must be blocked (exit code 3)
        run: |
          set +e
          aiact assess examples/emotion-at-work.toml > /dev/null
          test $? -eq 3
